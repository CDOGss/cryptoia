name: Bot CryptoIA (marche à blanc)

on:
  schedule:
    # Marché crypto ouvert 24/7 : un passage par jour suffit pour ce style
    # d'allocation quotidienne (créneau + rattrapage best-effort le lendemain).
    - cron: "13 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # pour committer l'état (portfolio.json, history.json, rapport)
  pages: write
  id-token: write

concurrency:
  group: cryptoia
  cancel-in-progress: false

jobs:
  passage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Passage quotidien
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Committer l'état
        run: |
          git config user.name "cryptoia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add portfolio.json history.json daily_report.md performance_chart.png
          if git diff --staged --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "Passage CryptoIA $(date -u +%F)"
          # Push résilient : rebase si le dépôt a avancé, nouvel essai sur les erreurs
          # passagères de GitHub (Internal Server Error constatée le 24/09 et le 07/10/2026).
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              break
            fi
            if [ "$i" = 5 ]; then echo "::error::push impossible après 5 tentatives"; exit 1; fi
            echo "Push refusé (tentative $i), nouvel essai dans $((i * 15)) s..."
            sleep $((i * 15))
          done

      - name: Déployer le dashboard (GitHub Pages)
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  pages:
    needs: passage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
